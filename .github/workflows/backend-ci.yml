name: Backend CI

on:
  push:
    branches:
      - main
      - agent/**
    paths:
      - '后端/mini_program_backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - '后端/mini_program_backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Java 17 / Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 后端/mini_program_backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: 后端/mini_program_backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: 后端/mini_program_backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
